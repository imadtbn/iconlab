<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المصمّم المباشر | IconLab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600;700;800&family=Anton&family=Teko:wght@500;600&family=Oswald:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="customizer" data-nav="Customize">


<div class="page-head">
    <div class="container">
        <div class="crumb"><a href="index.html">Home</a> / Customizer</div>
        <h1>المصمّم <span style="color:var(--gold)">المباشر</span></h1>
        <p>كل تغيير تظهر نتيجته فوراً على القميص — أمامي وخلفي.</p>
    </div>
</div>
<div class="container custom-layout">
    <div class="custom-preview">
        <div class="preview-stage" id="stage"></div>
        <div class="view-toggle" id="viewToggle"><button class="active" data-v="front">Front</button><button
                data-v="back">Back</button></div>
    </div>
    <div class="custom-panel">
        <h2>✦ خصّص قميصك</h2>
        <p class="sub">التخصيصات تظهر مباشرة على المعاينة</p>
        <div id="csProduct"></div>
        <div class="f-row"><label>اللون — Color</label>
            <div class="swatches" id="csColors"></div>
        </div>
        <div class="f-row"><label>المقاس — Size *</label>
            <div class="sizes" id="csSizes"></div>
        </div>
        <div class="f-grid2">
            <div class="f-row"><label>اسم اللاعب — Name (+400 DA)</label><input class="f-input" id="inName"
                    maxlength="14" placeholder="مثال: NOUFEL"></div>
            <div class="f-row"><label>الرقم — Number (+300 DA)</label><input class="f-input" id="inNumber"
                    inputmode="numeric" maxlength="2" placeholder="10"></div>
        </div>
        <div class="f-row"><label>نوع الخط — Font</label>
            <div class="chips" id="csFonts"></div>
        </div>
        <div class="f-row"><label>لون الاسم والرقم — Print Color</label>
            <div class="swatches" id="csTextColors"></div>
        </div>
        <div class="f-row"><label>Patch إضافي (+500 DA)</label>
            <div class="chips" id="csPatches"></div>
        </div>
        <div class="price-summary">
            <div class="row"><span>سعر القميص</span><span id="sumPrice"></span></div>
            <div class="row"><span>تكلفة التخصيص</span><span id="sumExtras"></span></div>
            <div class="total"><span>الإجمالي</span><span id="sumTotal"></span></div>
        </div>
        <br><button class="btn btn-red btn-block" id="addCustom" style="padding:18px">أضف التصميم إلى السلة 🛒</button>
        <p style="text-align:center;color:var(--grey);font-size:11px;margin-top:12px">✓ يُحفظ التصميم كصورة مع طلبك
            لضمان الطباعة الدقيقة</p>
    </div>
</div>

    <script src="js/data.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/pages.js"></script>
</body>

</html>
