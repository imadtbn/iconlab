<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اتصل بنا | IconLab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600;700;800&family=Anton&family=Teko:wght@500;600&family=Oswald:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="contact" data-nav="Contact">

<div class="page-head">
    <div class="container">
        <div class="crumb"><a href="index.html">Home</a> / Contact</div>
        <h1>تواصل <span style="color:var(--red)">معنا</span></h1>
    </div>
</div>
<section class="section">
    <div class="container" style="display:grid;grid-template-columns:1fr 1.2fr;gap:36px" id="contactWrap">
        <div>
            <div class="step" style="margin-bottom:14px">
                <h3>📱 WhatsApp / Phone</h3>
                <p style="direction:ltr;text-align:left">+213 555 12 34 56</p>
            </div>
            <div class="step" style="margin-bottom:14px">
                <h3>📷 Instagram</h3>
                <p>@iconlab.dz — راسلنا DM للطلب السريع</p>
            </div>
            <div class="step">
                <h3>🎵 TikTok</h3>
                <p>@iconlab.dz — شاهد أحدث التصاميم يومياً</p>
            </div>
        </div>
        <form class="form-card" id="contactForm">
            <h3>أرسل رسالة</h3>
            <div class="f-row"><label>الاسم</label><input class="f-input" required placeholder="اسمك"></div>
            <div class="f-row"><label>البريد / الهاتف</label><input class="f-input" required placeholder="للرد عليك">
            </div>
            <div class="f-row"><label>الرسالة</label><textarea class="f-textarea" rows="4" required
                    placeholder="كيف نساعدك؟"></textarea></div>
            <button class="btn btn-red btn-block">إرسال ✈</button>
        </form>
    </div>
</section>
<style>
    @media(max-width:760px) {
        #contactWrap {
            grid-template-columns: 1fr
        }
    }
</style>

    <script src="js/config.js"></script>
    <script src="js/data.js"></script>
    <script src="js/database.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/pages.js"></script>
</body>

</html>
